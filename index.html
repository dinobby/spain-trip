<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>西班牙行程 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Chiron+GoRound+TC:wght@400;500&family=DM+Sans:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: the whole trip as one ticket strip (city bands over 7 days + packing), sticky on top.
   Below it, each day opens with a big date numeral, then timeline | sticky route map + notes. Phones stack map, timeline, notes. */
:root{
  --bg:#F5F6F9; --paper:#FFFFFF; --ink:#131933; --ink-2:#4B5272; --ink-3:#8A90A8; --line:#E2E5EE; --line-2:#CDD2E0;
  --cobalt:#2443B5; --cobalt-soft:#E7ECFB;
  --saffron:#F2A900; --saffron-ink:#8F5D00; --saffron-soft:#FFF2CC;
  --bcn:#167A8B; --bcn-soft:#DDF0F2; --mad:#A8253A; --mad-soft:#F7E1E4; --go:#6A7089; --go-soft:#ECEDF2;
  --paprika:#B3441E; --paprika-soft:#FBE7DE; --red:#C3322A; --red-soft:#FBE3E1; --green:#2A7A4B; --green-soft:#E0F1E6;
  --map-bg:#EEF1F7; --map-grid:#D9DEEA; --on-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(19,25,51,.05),0 8px 24px -12px rgba(19,25,51,.18);
  /* one font + weight per place on the page (tune them in the font lab) */
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-round:"Chiron GoRound TC","Noto Sans TC","PingFang TC",sans-serif;
  --f-num:"DM Sans","Noto Sans TC",system-ui,sans-serif;
  --f-h1:var(--f-body); --w-h1:700;
  --f-es:var(--f-num); --w-es:400;
  --f-strip:var(--f-num); --w-strip:400;
  --f-dnum:var(--f-num); --w-dnum:400;
  --f-h2:var(--f-round); --w-h2:400;
  --f-h3:var(--f-body); --w-h3:500;
  --f-h4:var(--f-body); --w-h4:500;
  --f-time:"Noto Serif TC","Songti TC",serif; --w-time:400;
  --f-chip:var(--f-round); --w-chip:500;
  --strip-h:92px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F1D; --paper:#141932; --ink:#E9ECF7; --ink-2:#A6ACC6; --ink-3:#6D7393; --line:#232A47; --line-2:#323A5C;
  --cobalt:#93A7FF; --cobalt-soft:#1C2450;
  --saffron:#FFC23D; --saffron-ink:#FFC23D; --saffron-soft:#352A0C;
  --bcn:#5CC6D6; --bcn-soft:#12303A; --mad:#FF8597; --mad-soft:#3A1720; --go:#9AA0BA; --go-soft:#1E2340;
  --paprika:#FF9A72; --paprika-soft:#3A1E14; --red:#FF8478; --red-soft:#3D1918; --green:#71D69C; --green-soft:#12301F;
  --map-bg:#10142A; --map-grid:#1F2644; --on-ink:#0C0F1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F1D; --paper:#141932; --ink:#E9ECF7; --ink-2:#A6ACC6; --ink-3:#6D7393; --line:#232A47; --line-2:#323A5C;
  --cobalt:#93A7FF; --cobalt-soft:#1C2450;
  --saffron:#FFC23D; --saffron-ink:#FFC23D; --saffron-soft:#352A0C;
  --bcn:#5CC6D6; --bcn-soft:#12303A; --mad:#FF8597; --mad-soft:#3A1720; --go:#9AA0BA; --go-soft:#1E2340;
  --paprika:#FF9A72; --paprika-soft:#3A1E14; --red:#FF8478; --red-soft:#3D1918; --green:#71D69C; --green-soft:#12301F;
  --map-bg:#10142A; --map-grid:#1F2644; --on-ink:#0C0F1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--strip-h) + 16px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 0}
.wrap-main{padding-block:0 72px}
@media (min-width:720px){.wrap{padding-inline:32px}}
a{color:var(--cobalt);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.c-bcn{--city:var(--bcn);--city-soft:var(--bcn-soft)}
.c-mad{--city:var(--mad);--city-soft:var(--mad-soft)}
.c-go{--city:var(--go);--city-soft:var(--go-soft)}
.c-pack{--city:var(--saffron);--city-soft:var(--saffron-soft)}

/* hero */
.hero{padding-bottom:22px}
.hero h1{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;line-height:1}
.hero h1 .zh{font-family:var(--f-h1);font-weight:var(--w-h1);font-size:clamp(56px,11vw,112px)}
.hero h1 .es{font-family:var(--f-es);font-weight:var(--w-es);font-size:clamp(22px,3.6vw,36px);color:var(--ink-2)}
.hero h1 .es i{font-style:normal;color:var(--bcn)} .hero h1 .es b{font-weight:400;color:var(--mad)}

/* ticket strip */
.strip-shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.strip-shell.stuck{border-bottom-color:var(--line)}
.strip{max-width:1180px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:repeat(7,minmax(74px,1fr)) minmax(84px,1.1fr);grid-template-rows:auto auto;column-gap:6px;row-gap:5px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.strip::-webkit-scrollbar{display:none}
@media (min-width:720px){.strip{padding-inline:32px}}

.seg{grid-row:1;font-size:12px;font-weight:500;color:var(--city);display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.seg::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.day{grid-row:2;scroll-snap-align:start;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:8px;padding:8px 10px 8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;text-align:left;overflow:hidden;transition:transform .15s ease,border-color .15s,box-shadow .15s}
.day::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--city)}
.day:hover{border-color:var(--line-2);transform:translateY(-1px)}
.day .n{font-family:var(--f-strip);font-weight:var(--w-strip);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.day .m{display:grid;line-height:1.25;min-width:0}
.day .wd{font-size:12px;color:var(--ink-2)}
.day .ct{font-size:12px;font-weight:700;color:var(--city);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink);box-shadow:var(--shadow)}
.day[aria-selected="true"] .wd{color:inherit;opacity:.75}
.day[aria-selected="true"] .ct{color:var(--city)}
.day .today{position:absolute;top:9px;right:8px;font-size:10.5px;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;background:var(--saffron);color:#1A1200}
.day.past:not([aria-selected="true"]) .n{color:var(--ink-3)}
.day.c-pack .n{font-family:var(--f-h4);font-weight:var(--w-h4);font-size:22px}
@media (max-width:600px){
  .strip{grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.25fr);column-gap:4px;padding-inline:12px;overflow:visible}
  .seg{font-size:11px;gap:4px}
  .day{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding:9px 2px 6px;border-radius:10px}
  .day .n{font-size:22px}
  .day .wd{font-size:11px}
  .day .ct{display:none}
  .day .today{top:7px;right:4px;width:7px;height:7px;padding:0;font-size:0;border-radius:50%}
  .day.c-pack .n{font-size:15px}
  .day.c-pack .ct{display:block;font-size:11px}
  .day.c-pack .wd{display:none}
}
/* day head */
.day-view{padding-top:26px}
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:start;margin-bottom:24px}
.dnum{font-family:var(--f-dnum);font-weight:var(--w-dnum);font-size:clamp(84px,14vw,148px);line-height:.82;color:var(--city);font-variant-numeric:tabular-nums;margin-top:2px}
.dnum small{display:block;font-family:var(--f-body);font-size:13px;line-height:1.2;color:var(--ink-2);margin-top:10px;text-align:center}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--ink-2);margin:0 0 6px}
.dmeta .city{font-weight:700;color:var(--city);display:inline-flex;align-items:center;gap:6px}
.dmeta .city::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--city)}
.hol-badge{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--saffron-soft);color:var(--saffron-ink)}
.dhead h2{font-family:var(--f-h2);font-weight:var(--w-h2);font-size:clamp(26px,3.6vw,38px);line-height:1.25;margin:0;text-wrap:balance}
.dhead .sub{margin:8px 0 0;color:var(--ink-2);max-width:60ch;text-wrap:pretty}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.stats li{display:flex;align-items:baseline;gap:6px}
.stats b{font-family:var(--f-time);font-weight:var(--w-time);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats .warn b,.stats .warn{color:var(--red)}
.stats .ok{color:var(--green)}
@media (max-width:560px){.dhead{grid-template-columns:minmax(0,1fr)}.dnum{display:flex;align-items:baseline;gap:10px;font-size:76px}.dnum small{display:inline;margin:0}}

/* next up (only on a trip day) */
.nextup{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-radius:14px;background:var(--saffron-soft);margin-bottom:22px}
.nextup .lbl{font-size:12px;font-weight:700;color:var(--saffron-ink)}
.nextup .t{font-family:var(--f-time);font-weight:var(--w-time);font-variant-numeric:tabular-nums}
.nextup .what{font-weight:700;min-width:0}
.nextup .eta{font-size:13px;color:var(--ink-2)}
.nextup a{margin-left:auto;font-size:13.5px;font-weight:700;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--on-ink)}

.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:28px 40px;align-items:start}
.side{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--strip-h) + 14px);max-height:calc(100dvh - var(--strip-h) - 28px);overflow:auto;scrollbar-width:thin;overscroll-behavior:contain;border-radius:16px}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .side{display:contents}
  .p-map{order:-1}
}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px 22px minmax(0,1fr);column-gap:12px;position:relative}
@media (max-width:560px){.it{grid-template-columns:42px 20px minmax(0,1fr);column-gap:8px}.it .t{font-size:13px}.it .body{padding-inline:8px}}
.it .t{font-family:var(--f-time);font-weight:var(--w-time);font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;padding-top:15px}
.it .t small{display:block;font-size:12px;color:var(--ink-3)}
.it .t.flex{font-family:var(--f-body);font-size:12px;color:var(--ink-3)}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.it:first-child .rail::before{top:18px}
.it:last-child .rail::before{bottom:auto;height:18px}
.it.flex .rail::before{background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px)}
.node{appearance:none;-webkit-appearance:none;position:relative;z-index:1;margin:14px 0 0;width:20px;height:20px;border-radius:50%;border:2px solid var(--city);background:var(--bg);cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .15s}
.node:hover{transform:scale(1.12)}
.node::after{content:"";width:6px;height:10px;border:solid var(--on-ink);border-width:0 2px 2px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .15s}
.node:checked{background:var(--city)}
.node:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.it.fixed .node{border-width:5px}
.it.fixed .node:checked{border-width:2px}
.it .body{min-width:0;display:grid;gap:5px;padding:11px 12px 14px;margin:2px 0;border-radius:12px;transition:background .15s}
.it.hot .body{background:var(--paper);box-shadow:var(--shadow)}
.it .h{line-height:1.5}
.it .h>*{vertical-align:2px;margin-left:6px}
.it .h>.num{margin:0 8px 0 0;vertical-align:3px}
.it h3{display:inline;font-family:var(--f-h3);font-size:16.5px;font-weight:var(--w-h3);margin:0 !important;line-height:1.45;vertical-align:baseline !important}
.it p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.65;max-width:62ch}
.it .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;margin-top:2px}
.it.done h3{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.it.done p,.it.done .meta,.it.done .chip,.it.done .num{opacity:.5}
.it.now .node{box-shadow:0 0 0 5px color-mix(in srgb,var(--saffron) 35%,transparent)}
.it.now .body{background:var(--saffron-soft)}
.now-tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--saffron);color:#1A1200}

.num{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:999px;border:0;background:var(--city);color:var(--on-ink);font-family:var(--f-num);font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto;transition:transform .15s}
.num:hover{transform:scale(1.1)}
.num.opt{background:transparent;color:var(--city);box-shadow:inset 0 0 0 1.5px var(--city)}
.num.on{background:var(--saffron);color:#1A1200;box-shadow:none}
.chip{display:inline-flex;align-items:center;font-family:var(--f-chip);font-size:12px;font-weight:var(--w-chip);line-height:1.5;padding:0 8px;border-radius:999px;white-space:nowrap}
.chip.fixed{background:var(--ink);color:var(--on-ink)}
.chip.book{background:var(--saffron-soft);color:var(--saffron-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--saffron) 45%,transparent)}
.chip.opt{color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.chip.food{background:var(--paprika-soft);color:var(--paprika)}
.chip.shot{background:var(--cobalt);color:var(--paper)}
.see{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink);max-width:62ch}
.see b,.shots b{font-family:var(--f-chip);font-weight:var(--w-chip);font-size:12px;margin-right:6px}
.see b{color:var(--bcn)} .c-mad .see b{color:var(--mad)}
.eats{margin:0;font-size:13.5px;line-height:1.7;max-width:62ch}
.eats b{font-family:var(--f-chip);font-weight:var(--w-chip);font-size:12px;margin-right:6px;color:var(--paprika)}
.eats .dish{font-weight:500}
.eats .dish.st::after{content:"很多人推";font-family:var(--f-chip);font-size:11px;font-weight:var(--w-chip);margin-left:4px;padding:0 6px;border-radius:999px;background:var(--paprika-soft);color:var(--paprika);vertical-align:1px}
.eats small{font-size:12.5px;color:var(--ink-2);font-weight:400}
.dish-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px}
.dish-list li{display:grid;gap:2px}
.dish-list .dn{font-weight:700}
.dish-list .wh{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.dish-list button{all:unset;cursor:pointer;color:var(--cobalt)}
.dish-list button:hover{text-decoration:underline}
.shots{display:grid;gap:2px;margin:2px 0;padding:6px 10px;border-radius:10px;background:var(--cobalt-soft);font-size:13.5px}
.shots b{color:var(--cobalt)}
.shots span{display:block}
.shot-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.shot-list li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:baseline}
.shot-list .w{font-family:var(--f-time);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.shot-list button{all:unset;cursor:pointer;color:var(--ink)}
.shot-list button:hover{color:var(--cobalt);text-decoration:underline}
.shot-list small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.maplink{display:inline-flex;align-items:center;gap:4px;font-weight:500;text-decoration:none;color:var(--cobalt)}
.maplink:hover{text-decoration:underline}
.hrs{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;color:var(--ink-2)}
.hrs .v{font-family:var(--f-time);font-size:12.5px;font-weight:var(--w-time);color:var(--green);font-variant-numeric:tabular-nums}
.hrs .v.closed{color:var(--red)}
.hrs .na{color:var(--ink-3)}
.bad{font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.week-d{font-size:12.5px}
.week-d[open]{flex-basis:100%}
.week-d summary{cursor:pointer;color:var(--ink-3);width:max-content;list-style:none}
.week-d summary::-webkit-details-marker{display:none}
.week-d summary::before{content:"▸ ";font-size:10px}
.week-d[open] summary::before{content:"▾ "}
.week{border-collapse:collapse;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.week th{font-weight:400;color:var(--ink-3);text-align:left;padding:1px 14px 1px 0;white-space:nowrap}
.week td{font-family:var(--f-time);font-size:12px;padding:1px 0;color:var(--ink-2)}
.week tr.cur th,.week tr.cur td{color:var(--ink);font-weight:600}
.week .hol{font-family:var(--f-body);font-size:11px;color:var(--saffron-ink);font-weight:700}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h4{margin:0;font-family:var(--f-h4);font-size:19px;font-weight:var(--w-h4);line-height:1.3;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.panel h4 small{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--ink-3)}
.mapbox{background:var(--map-bg);border-radius:12px;overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.pt{cursor:pointer}
.pt circle{transition:r .15s}
.pt .lbl{display:none;font-family:var(--f-body);font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:4px;stroke-linejoin:round}
.pt.on .lbl{display:block}
.pt.on circle{r:13;fill:var(--saffron);stroke:var(--saffron)}
.pt.on text.n{fill:#1A1200}
.pt:focus-visible{outline:none}
.pt:focus-visible circle{stroke:var(--ink);stroke-width:3}
.route-btns{display:flex;flex-wrap:wrap;gap:8px}
.route-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-ink);text-decoration:none;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;transition:transform .15s}
.route-btn:hover{transform:translateY(-1px)}
.route-btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.mapnote{font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.55}
.empty-map{padding:40px 20px;text-align:center;color:var(--ink-2);font-size:14px}

  {t:"14:50",title:"Xurreria Laietana 吉拿棒",place:"Xurreria Laietana",tag:"food"},
  {t:"15:05",title:"主教橋",see:"在 Carrer del Bisbe，從主教座堂這頭往橋拍，拱橋跟窄巷會一起入鏡。",place:"主教橋",desc:"哥德區最常被拍的那座拱橋。"},
  {t:"15:15",title:"Carrer dels Sagristans",place:"Carrer dels Sagristans",desc:"大教堂旁邊的小街，從這裡繞到主教座堂正門。"},
  {t:"15:30",title:"巴塞隆納主教座堂",see:"哥德式正面、迴廊裡養的 13 隻白鵝，再搭電梯上屋頂看哥德區。",place:"巴塞隆納主教座堂",tag:"fixed",desc:"票是 15:30。週日 16:30 就關，看 45 分鐘左右，屋頂記得上去。16:15 出來走去畢卡索，大概 8 分鐘。"},
  {t:"16:30",title:"畢卡索美術館",see:"收藏偏畢卡索早期作品。一定要看他重畫維拉斯奎茲《侍女》的那一整個系列。",place:"畢卡索美術館",tag:"fixed",desc:"票是 16:30，開到 19:00。大概逛 1.5 小時。"},
  {t:"18:15",title:"Pg. de Colom 港邊散步、看夕陽",see:"La Rambla 走到底就是哥倫布紀念柱，從這裡沿港口散步。",shots:["哥倫布之塔（由上往下）"],place:"Pg. de Colom",desc:"日落大約 19:10。"},
  {t:"20:00",title:"旅館附近吃晚餐，早點睡",place:"Casa Pince"}
 ],
 notes:["週日 Boqueria、聖卡特琳娜市場、Cereria Subirà 都沒開，Nomad Coffee 週末也休息，這些全部移到週二。","主教座堂週日只開 14:00–16:30，海洋聖母聖殿週日只開 13:00–18:00。","La Rambla 跟地鐵扒手很多。手機不要放後口袋，背包背前面。","西班牙晚餐大概 20:30 才開始，下午先吃點 tapas 墊肚子。"]},

{id:"d2",date:"2026-10-12",md:"10/12",wd:"週一",city:"巴塞隆納",holiday:"國慶日",title:"高第日：巴特略、米拉、桂爾公園、Bunkers 夕陽",sub:"早上在擴建區看高第的房子，下午上山，最後在 Bunkers 看夕陽。",
 items:[
  {t:"08:15",title:"從旅館出發",place:"Casa Pince",desc:"地鐵 L3 Liceu → Passeig de Gràcia，或走路 25 分鐘。"},
  {t:"08:45",title:"巴特略之家",see:"外牆像龍的鱗片，屋頂是龍背。裡面看主樓層的大窗，還有中庭由淺到深的藍色磁磚。",place:"巴特略之家",tag:"fixed",desc:"票是 08:45。大概看 1 小時 15 分，10:00 左右出來。隔壁就是 Casa Amatller，再過去是 Casa Lleó Morera，三棟合稱不和諧街區，外觀拍一拍再慢慢走去米拉之家。"},
  {t:"11:00",title:"米拉之家",see:"屋頂那群像戰士頭盔的煙囪，還有頂樓閣樓的磚拱，裡面展高第的建築模型。",place:"米拉之家",tag:"fixed",desc:"票是 11:00。從巴特略沿 Passeig de Gràcia 走過來 10 分鐘。屋頂的煙囪一定要上去看。也是 1 小時 15 分左右。"},
  {t:"12:45",title:"午餐：Cerveceria Catalana",eats:[["辣醬馬鈴薯塊", "招牌", 1], ["蕃茄麵包", "", 0], ["炸丸子", "", 0]],place:"Cerveceria Catalana",tag:"food",desc:"超熱門，早點去排。客滿就改去 Vinitus 或 Tapa Tapa。"},
  {t:"",title:"備案：Vinitus",eats:[["炸丸子", "火腿口味", 0], ["馬鈴薯烘蛋", "", 0]],place:"Vinitus",tag:"opt"},
  {t:"",title:"備案：Tapa Tapa Passeig de Gràcia",eats:[["辣醬馬鈴薯塊", "", 0]],place:"Tapa Tapa",tag:"opt"},
  {t:"14:15",title:"DeLaCrem 冰淇淋",place:"DeLaCrem",tag:"food",desc:"在 Enric Granados，這條街很好逛。"},
  {t:"15:00",title:"搭計程車上桂爾公園",desc:"約 15 分鐘。公車 V17 或 24 也可以。"},
  {t:"15:30",title:"桂爾公園（從 Carrer d'Olot, 4 入口進）",place:"桂爾公園入口（Carrer d'Olot, 4）",tag:"fixed",desc:"票是 15:30，入場時段要準時。"},
  {t:"15:40",title:"桂爾公園紀念區",see:"主階梯中間的馬賽克大蜥蜴；往上是百柱廳，天花板有馬賽克圓盤；再上去是廣場邊的蛇形長椅，可以看整個巴塞隆納。",shots:["奎爾公園（柱子）", "奎爾公園（好大的蜥蜴哦）"],place:"桂爾公園",desc:"蜥蜴、百柱廳、蛇形長椅。大概逛 1.5 小時。"},
  {t:"17:30",title:"去 Bunkers del Carmel",place:"Bunkers del Carmel",desc:"計程車 10 分鐘，走上坡 25 分鐘。免費。山上風大，帶外套。"},
  {t:"19:10",title:"Bunkers 看夕陽",see:"西班牙內戰時的防空砲台。360 度看整個城市，聖家堂跟海都看得到。",place:"Bunkers del Carmel",desc:"Google 地圖寫 19:30 關，看完夕陽就下山。"},
  {t:"20:30",title:"晚餐：Bar Cañete",eats:[["炸魷魚", "炸魷魚三明治", 1], ["炸丸子", "火腿口味", 1], ["蕃茄麵包", "", 0]],place:"Bar Cañete",tag:"food",desc:"從週日改到今天，週一 13:00–24:00 有開。先訂位。"},
  {t:"",title:"維森斯之家（時間夠再去）",see:"外牆是綠白磁磚加萬壽菊圖案，跟後來的高第很不一樣。",place:"維森斯之家",tag:"opt",desc:"高第的第一棟房子，從桂爾公園走下坡 15 分鐘。"}
 ],
 notes:["今天是西班牙國慶日（Fiesta Nacional）。高第的建築照常開，但 Boqueria、聖卡特琳娜市場、畢卡索美術館、Cheesebakers、Nomad Coffee 都沒開。","巴特略 08:45、米拉 11:00、桂爾公園 15:30 都訂好了，都是限時段，QR code 先截圖。","Bunkers 下山的路很暗，看完夕陽直接叫計程車。"]},

{id:"d3",date:"2026-10-13",md:"10/13",wd:"週二",city:"巴塞隆納",title:"市場、音樂宮、Sant Pau，17:45 進聖家堂",sub:"早上在舊城區逛市場跟小店，下午一路往北，最後進聖家堂。",
 items:[
  {t:"09:00",title:"Boqueria 市場吃早餐",see:"入口的鐵架彩色招牌很好拍。裡面喝現打果汁、吃一杯火腿。",place:"Boqueria 市場",tag:"food",desc:"離旅館很近。10:00 以後觀光客會多很多。"},
  {t:"10:30",title:"加泰羅尼亞音樂宮導覽",see:"主廳天花板倒吊的彩繪玻璃天窗，還有舞台後牆浮出來的繆思女神雕像。",place:"加泰羅尼亞音樂宮",tag:"fixed",desc:"票是 10:30 的導覽，約 50 分鐘。裡面只有跟導覽或聽音樂會才進得去。"},
  {t:"11:30",title:"Nomad Coffee",place:"Nomad Coffee",tag:"food"},
  {t:"12:00",title:"聖卡特琳娜市場",place:"聖卡特琳娜市場",tag:"opt",desc:"屋頂是彩色的波浪磁磚。"},
  {t:"12:20",title:"Jon Cake 起司蛋糕",place:"Jon Cake",tag:"food"},
  {t:"12:45",title:"Cereria Subirà 老蠟燭店",see:"1761 年開的。店裡的雕花樓梯跟拿火炬的女神像。",place:"Cereria Subirà",tag:"opt",desc:"巴塞隆納最老的店之一。"},
  {t:"13:15",title:"Born 區午餐",shots:["餐廳舉手（你好～西班牙海鮮燉飯不要青椒）"],tag:"food",desc:"吃西班牙海鮮燉飯（paella），順便拍舉手點餐那段。評論推 Casa Delfín（Passeig del Born 36），或是 1836 年開的 7 Portes（Passeig d'Isabel II 14，要訂位）。"},
  {t:"14:30",title:"凱旋門",see:"紅磚拱門，1888 年世界博覽會的入口。往南一整條大道通到 Ciutadella 公園。",place:"凱旋門",tag:"opt",desc:"拍完照從 Arc de Triomf 站搭計程車或地鐵往北。"},
  {t:"15:00",title:"Sant Pau 現代主義建築群",see:"以前是醫院，每棟病房都有磁磚屋頂。地下通道把各棟連在一起。",place:"Sant Pau 建築群",tag:"book",desc:"開到 18:30，大概逛 1.5 小時。票還沒訂，要記得先買。"},
  {t:"16:40",title:"沿 Av. Gaudí 走到聖家堂",shots:["ㄛ～～～（看到勝家堂）"],desc:"走 10 分鐘，這條路正對著聖家堂。"},
  {t:"16:55",title:"聖家堂旁的公園，湖邊拍照",see:"在 Plaça de Gaudí，湖對面正對誕生立面，倒影也拍得到。",shots:["勝家堂（由上往下）"],place:"聖家堂旁遊樂區",desc:"休息一下。從湖對面可以拍到誕生立面。"},
  {t:"17:30",title:"到聖家堂入口排安檢",place:"聖家堂",tag:"fixed"},
  {t:"17:45",title:"聖家堂入場",see:"東邊的誕生立面是高第親手做的，西邊的受難立面線條很硬。裡面像樹林的柱子，彩窗東邊偏藍綠、西邊偏橘紅。",place:"聖家堂",tag:"fixed",desc:"週二開到 20:00，可以看 2 小時左右。傍晚陽光從西側彩窗照進來，暖色光最漂亮，先看內部。"},
  {t:"19:50",title:"晚餐：El Glop Gaudí",place:"El Glop Gaudí",tag:"food",desc:"開到 24:00。菜單上有辣醬馬鈴薯塊、炸小青椒、炸丸子、炸魷魚、加泰隆尼亞奶油，但評論沒特別推，當作保底。"},
  {t:"",title:"Cheesebakers（20:00 關，要去就在聖家堂之前）",place:"Cheesebakers",tag:"opt"},
  {t:"21:30",title:"回旅館打包",place:"Casa Pince",desc:"明天 08:00 就要出發去車站。"}
 ],
 notes:["聖家堂是教堂，肩膀要遮住，褲子跟裙子不要太短。","票上的 QR code 先截圖，不要賭現場有網路。","Google 地圖沒有音樂宮的營業時間，導覽時段看官網。","今晚就把行李收好，明天早上很趕。"]},

{id:"d4",date:"2026-10-14",md:"10/14",wd:"週三",city:"馬德里",title:"火車到馬德里，逛老城區、王宮、德波神廟夕陽",sub:"09:00 從 Sants 坐到 Atocha。Casa Hernanz 13:30 就午休，放完行李直接過去。",
 items:[
  {t:"08:00",title:"退房出發",place:"Casa Pince",desc:"地鐵 L3 Liceu → Sants Estació，或搭計程車，都是 15 分鐘左右。"},
  {t:"08:20",title:"Barcelona Sants 車站過安檢",place:"Barcelona Sants 車站",desc:"長途火車行李要過安檢，至少提早 30 分鐘到。"},
  {t:"09:00",title:"火車出發去馬德里",tag:"fixed",desc:"2.5–3 小時，以車票上的時間為準。"},
  {t:"11:45",title:"抵達 Madrid Puerta de Atocha",place:"Madrid Puerta de Atocha 車站",desc:"搭 Cercanías 坐一站到 Sol 就是旅館，或搭計程車 10 分鐘。"},
  {t:"12:30",title:"Hostal Sun Gate 寄放行李",place:"Hostal Sun Gate"},
  {t:"12:45",title:"Casa Hernanz 草編鞋",see:"百年老店，整面牆都是 espadrilles，尺寸顏色很齊。",place:"Casa Hernanz",tag:"opt",desc:"週三 09:30–13:30、16:30–20:00，中午會午休，13:30 前要到。"},
  {t:"13:20",title:"主廣場",eats:[["炸魷魚", "旁邊 La Campana（C. de Botoneras 6）、Casa Rúa（C. de Ciudad Rodrigo 3）的三明治", 1]],see:"一圈紅色建築，北邊有壁畫那棟是 Casa de la Panadería。中間是菲利普三世騎馬像。",place:"主廣場"},
  {t:"13:30",title:"午餐：聖米格爾市場",eats:[["炸丸子", "Arzábal 攤", 0], ["炸魷魚", "El Señor Martín 攤的三明治", 0], ["馬鈴薯烘蛋", "Picolisto 攤", 0]],see:"鐵架玻璃的老市場，一攤一攤 tapas，生蠔、橄欖串、火腿都有。",place:"聖米格爾市場",tag:"food"},
  {t:"14:30",title:"馬德里王宮",meet:"C. de Carlos III, 1, Centro, 28013 Madrid, Spain",see:"王座廳的天花板壁畫（Tiepolo 畫的）、皇家藥房、兵器館。出來看對面的阿穆德納主教座堂。",place:"馬德里王宮",tag:"fixed",desc:"票是 14:30，集合地點在 C. de Carlos III, 1，從聖米格爾市場走過去不遠，提早 10 分鐘到。大概逛 1.5–2 小時。"},
  {t:"17:30",title:"走去德波神廟，順便逛西班牙廣場",place:"德波神廟",desc:"從王宮走過去 15 分鐘。"},
  {t:"19:20",title:"德波神廟看夕陽",see:"埃及送給西班牙的兩千多年古神廟。重點是水池倒影加夕陽。",place:"德波神廟",desc:"神廟裡面 20:00 關，外面的公園可以一直待到天黑。"},
  {t:"20:30",title:"回太陽門看熊與莓樹",see:"馬德里的市徽。太陽門郵政總局門口地上有西班牙公路起點 Km 0 的牌子。",place:"熊與莓樹"},
  {t:"20:40",title:"小老鼠 Pérez 信箱",see:"在 Calle del Arenal 8，牆上有小老鼠的牌子。",place:"小老鼠 Pérez 信箱",desc:"西班牙版的牙仙子。"},
  {t:"20:50",title:"晚餐：Museo del Jamón",eats:[["炸魷魚", "三明治", 0]],see:"天花板掛滿火腿，站著吃最快。",place:"Museo del Jamón",tag:"food",desc:"火腿三明治，開到 24:00。"},
  {t:"22:00",title:"San Ginés 吉拿棒配熱巧克力",see:"1894 年開的，在小巷 Pasadizo de San Ginés 裡。",place:"Chocolatería San Ginés",tag:"food",desc:"24 小時都開，就在旅館旁邊。"},
  {t:"",title:"旅館旁小店：Gracias Mamá",place:"Gracias Mamá",tag:"opt",desc:"開到 21:00。"},
  {t:"",title:"旅館旁小店：Mantequería Bermejo",place:"Mantequería Bermejo",tag:"opt",desc:"20:00 關，要早點去。"},
  {t:"",title:"旅館旁小店：San Ginés Book Shop",place:"San Ginés Book Shop",tag:"opt"}
 ],
 notes:["Barcelona Sants 上車，Madrid Puerta de Atocha 下車。進站要過安檢，大行李也要過 X 光。","Casa Hernanz 週三 13:30–16:30 午休，所以放完行李先去。","王宮遇到官方活動會臨時關，出發前看一下官網。"]},

{id:"d5",date:"2026-10-15",md:"10/15",wd:"週四",city:"馬德里",title:"麗池公園、索菲亞王后藝術中心、Malasaña 逛小店",sub:"早上公園跟美術館。17:00 小店都開了，再去 Malasaña 和 Chueca 一帶。",
 items:[
  {t:"10:00",title:"麗池公園大湖划船",see:"大湖邊的阿方索十二世紀念碑，划船時就在正前方。",place:"麗池公園",desc:"划船時間 10:00–14:00、15:30–20:00。"},
  {t:"10:45",title:"水晶宮",see:"整棟鐵架玻璃屋蓋在小湖邊，裡面通常是當代藝術展。",place:"水晶宮",desc:"換展期間偶爾不開，Google 地圖也沒寫營業時間。"},
  {t:"11:30",title:"Real Fábrica Cervantes",place:"Real Fábrica Cervantes",tag:"opt",desc:"11:00 開門。"},
  {t:"12:00",title:"索菲亞王后藝術中心（看格爾尼卡）",see:"格爾尼卡在二樓 206 展廳，同一層還有達利跟米羅。",place:"索菲亞王后藝術中心",tag:"opt",desc:"週四 10:00–21:00（週二休館）。大概逛 1.5 小時。"},
  {t:"13:35",title:"DOOC Atocha",place:"DOOC Atocha",tag:"opt",desc:"12:00–15:00 開，15:00 開始午休，要趕在午休前。"},
  {t:"14:00",title:"午餐：Antón Martín 一帶",eats:[["馬鈴薯烘蛋", "CARACOLA 的招牌，裡面半熟", 1]],place:"CARACOLA Antón Martín",tag:"food"},
  {t:"16:30",title:"去 Malasaña，Pan y Pepinillos 喝咖啡",place:"Pan y Pepinillos",tag:"food",desc:"地鐵到 Tribunal，或搭計程車 10 分鐘。開到 20:00。"},
  {t:"17:00",title:"La Antigua",place:"La Antigua",tag:"opt"},
  {t:"17:20",title:"El Moderno",place:"El Moderno",tag:"opt"},
  {t:"17:35",title:"La Postalera",place:"La Postalera",tag:"opt"},
  {t:"17:55",title:"Nest Boutique",place:"Nest Boutique",tag:"opt"},
  {t:"18:20",title:"La Europea",place:"La Europea",tag:"opt",desc:"20:00 關。"},
  {t:"18:40",title:"Casa Gonzalez & Gonzalez",place:"Casa Gonzalez & Gonzalez",tag:"opt"},
  {t:"19:00",title:"SLOWLY Concept Store",place:"SLOWLY Concept Store",tag:"opt"},
  {t:"19:20",title:"Ofelia Home & Decor",place:"Ofelia Home & Decor",tag:"opt",desc:"20:30 關。"},
  {t:"20:30",title:"最後一晚吃好一點，回旅館打包",place:"Hostal Sun Gate",tag:"food"}
 ],
 notes:["很多小店中午會午休（DOOC 15:00–16:30、La Europea 14:00–16:00、Casa Gonzalez 14:30–17:00、Nest 14:30–16:00），所以逛店排在下午。","塞哥維亞要花一整天（從 Chamartín 搭 AVANT 約 30 分鐘）。真的想去就拿今天整天去，其他都取消。","拉斯班塔斯鬥牛場在東邊比較遠，有內部導覽（週四 10:00–18:00）。很想看再去。","同一間店買到一定金額就能退稅，記得跟店家拿退稅單，明天在機場辦。"]},
{id:"d6",date:"2026-10-16",md:"10/16",wd:"週五",city:"回家",title:"馬德里 → Boston → Raleigh",sub:"上午就出發去機場。飛美國要提早 3 小時到。",
 items:[

const CITY={"巴塞隆納":"bcn","馬德里":"mad","出發":"go","回家":"go"};
const cityOf=d=>CITY[d.city]||"go";

const $ = s=>document.querySelector(s);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let done; try{ done = JSON.parse(store.get("trip-done")||"{}") }catch(e){ done = {} }

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` }
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const dayDiff=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDur=m=>m<60?`${m} 分鐘`:(m%60?`${Math.floor(m/60)} 小時 ${m%60} 分`:`${m/60} 小時`);


function renderDays(sel){
  const t=todayStr();
  const seg=(col,span,cls,txt)=>`<span class="seg ${cls}" style="grid-column:${col}/span ${span}">${txt}</span>`;
  $("#days").innerHTML =
    seg(1,1,"c-go","飛")+seg(2,3,"c-bcn","巴塞隆納 3 晚")+seg(5,2,"c-mad","馬德里 2 晚")+seg(7,1,"c-go","回")+seg(8,1,"c-pack","出發前")+
    DAYS.map(d=>`<button class="day c-${cityOf(d)}${d.date<t?' past':''}" role="tab" id="tab-${d.id}" aria-selected="${d.id===sel}" aria-controls="view" data-id="${d.id}" aria-label="${d.md} ${d.wd} ${d.city}">
    <span class="n">${d.md.slice(3)}</span><span class="m"><span class="wd">${d.wd}</span><span class="ct">${d.city}</span></span>${d.date===t?'<span class="today">今天</span>':''}</button>`).join("")
    + `<button class="day c-pack" role="tab" id="tab-pack" aria-selected="${sel==='pack'}" aria-controls="view" data-id="pack"><span class="n">行李</span><span class="m"><span class="wd">清單</span><span class="ct">${packCount()}</span></span></button>`;
  const strip=$("#days");
  strip.querySelectorAll(".day").forEach(b=>b.onclick=()=>select(b.dataset.id,true));
  strip.onkeydown=e=>{ if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return; const bs=[...strip.querySelectorAll(".day")]; const i=bs.indexOf(document.activeElement); if(i<0) return; const nb=bs[(i+(e.key==="ArrowRight"?1:-1)+bs.length)%bs.length]; select(nb.dataset.id,true); $("#tab-"+nb.dataset.id).focus(); };
  const cur=strip.querySelector('[aria-selected="true"]');
  if(cur){ const l=cur.offsetLeft-strip.offsetLeft, r=l+cur.offsetWidth; if(l<strip.scrollLeft||r>strip.scrollLeft+strip.clientWidth) strip.scrollLeft=Math.max(0,l-40); }
}

function routeOf(day){
  // ordered stops (consecutive duplicates removed) + unique numbering
  const seq=[], nums={}; let n=0;
  day.items.forEach(it=>{ if(!it.place || !it.t) return; if(seq[seq.length-1]!==it.place) seq.push(it.place); });
  day.items.forEach(it=>{ if(it.place && !(it.place in nums)) nums[it.place]=++n; });
  return {seq,nums};
}

function mapSVG(day,seq,nums){
  const keys=Object.keys(nums);
  if(keys.length<2) return '<div class="empty-map"><b>RDU → BOS → BCN</b>今天都在機場跟飛機上，沒有市區路線。</div>';
  const W=440,H=340,pad=34, city=cityOf(day);
  const kmLat=111.2, med=a=>{const s=a.slice().sort((x,y)=>x-y);return s[s.length>>1]};
  const core=keys.filter(k=>P[k][2]).length?keys.filter(k=>P[k][2]):keys; // saved places, not airports, decide the center
  const cLat=med(core.map(k=>P[k][0])), cLng=med(core.map(k=>P[k][1])), kx=Math.cos(cLat*Math.PI/180);
  const dist=k=>Math.hypot((P[k][0]-cLat)*kmLat,(P[k][1]-cLng)*kmLat*kx);
  // Airports and far stations would squash the city; draw them as edge markers instead
  const far=k=>dist(k)>6;
  const near=keys.filter(k=>!far(k));
  const X=lng=>lng*kx, Y=lat=>-lat;
  let minX=Math.min(...near.map(k=>X(P[k][1]))),maxX=Math.max(...near.map(k=>X(P[k][1]))),minY=Math.min(...near.map(k=>Y(P[k][0]))),maxY=Math.max(...near.map(k=>Y(P[k][0])));
  const minSpan=.012; if(maxX-minX<minSpan){const c=(minX+maxX)/2;minX=c-minSpan/2;maxX=c+minSpan/2} if(maxY-minY<minSpan){const c=(minY+maxY)/2;minY=c-minSpan/2;maxY=c+minSpan/2}
  const s=Math.min((W-2*pad)/(maxX-minX),(H-2*pad)/(maxY-minY));
  const ox=(W-(maxX-minX)*s)/2, oy=(H-(maxY-minY)*s)/2;
  const proj=(lat,lng)=>[ox+(X(lng)-minX)*s, oy+(Y(lat)-minY)*s];
  const cx=W/2, cy=H/2, edge=16;
  const xy=k=>{ const [x,y]=proj(P[k][0],P[k][1]); if(!far(k)) return [x,y];
    const dx=x-cx, dy=y-cy, t=Math.min((W/2-edge)/Math.abs(dx||1e-9),(H/2-edge)/Math.abs(dy||1e-9)); return [cx+dx*t, cy+dy*t]; };
  const kmPx=s/kmLat;
  const bar=[.25,.5,1,2,5].find(b=>kmPx*b>=48)||5;
  let bg="";
  if(city==="bcn"){ // Eixample blocks: 133 m grid, rotated ~45°
    let step=kmPx*.1335; while(step<9) step*=2;
    let g=""; for(let v=-W;v<=W*2;v+=step){g+=`<line x1="${v.toFixed(1)}" y1="${-H}" x2="${v.toFixed(1)}" y2="${H*2}"/><line x1="${-W}" y1="${v.toFixed(1)}" x2="${W*2}" y2="${v.toFixed(1)}"/>`}
    bg=`<g stroke="var(--map-grid)" stroke-width="1" transform="rotate(45 ${cx} ${cy})">${g}</g>`;
  } else if(city==="mad"){ // rings around Kilómetro Cero at Puerta del Sol
    const [kx0,ky0]=proj(40.41669,-3.70358); let g="";
    for(let r=1;r<=12;r++) g+=`<circle cx="${kx0.toFixed(1)}" cy="${ky0.toFixed(1)}" r="${(kmPx*r*.5).toFixed(1)}" fill="none"/>`;
    bg=`<g stroke="var(--map-grid)" stroke-width="1">${g}</g>`;
    if(kx0>0&&kx0<W&&ky0>0&&ky0<H) bg+=`<g fill="var(--ink-3)" font-family="DM Sans,sans-serif" font-size="10"><path d="M${kx0.toFixed(1)} ${(ky0-5).toFixed(1)}l5 5l-5 5l-5 -5z" fill="var(--ink-3)"/><text x="${(kx0+9).toFixed(1)}" y="${(ky0+16).toFixed(1)}">Km 0</text></g>`;
  } else {
    let g=""; for(let i=1;i<6;i++){g+=`<line x1="${W*i/6}" y1="0" x2="${W*i/6}" y2="${H}"/><line x1="0" y1="${H*i/6}" x2="${W}" y2="${H*i/6}"/>`}
    bg=`<g stroke="var(--map-grid)" stroke-width="1">${g}</g>`;
  }
  // nudge overlapping markers apart so every number stays readable
  const pos={}; keys.forEach(k=>pos[k]=xy(k));
  for(let it=0;it<40;it++) for(let i=0;i<keys.length;i++) for(let j=i+1;j<keys.length;j++){
    const a=pos[keys[i]], b=pos[keys[j]]; let dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy);
    if(d<23){ if(d<.01){dx=1;dy=0;d=1} const m=(23-d)/2; a[0]-=dx/d*m; a[1]-=dy/d*m; b[0]+=dx/d*m; b[1]+=dy/d*m; }
  }
  keys.forEach(k=>{pos[k][0]=Math.min(W-14,Math.max(14,pos[k][0])); pos[k][1]=Math.min(H-(far(k)?44:14),Math.max(far(k)?46:14,pos[k][1]));});
  const line=seq.map(k=>pos[k].map(v=>v.toFixed(1)).join(",")).join(" ");
  const pts=keys.map(k=>({k,n:nums[k],opt:!seq.includes(k),far:far(k)}));
  const kmTag={}, tagged=[];
  pts.filter(p=>p.far).forEach(p=>{const [x,y]=pos[p.k]; if(tagged.some(([a,b])=>Math.hypot(a-x,b-y)<60)) return; tagged.push([x,y]); kmTag[p.k]=1;});
  const dots=pts.sort((a,b)=>b.n-a.n).map(p=>{const [x,y]=pos[p.k]; const right=x>W*.58;
    const name=p.far?`${p.k}，${dist(p.k).toFixed(0)} km`:p.k;
    const lx=right?x-17:x+17, anchor=right?"end":"start";
    return `<g class="pt${p.far?' far':''}" data-place="${esc(p.k)}" tabindex="0" role="button" aria-label="${p.n}. ${esc(p.k)}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="${p.opt?'var(--map-bg)':'var(--city)'}" stroke="var(--city)" stroke-width="2"${p.far?' stroke-dasharray="3 2"':''}/>
      <text class="n" x="${x.toFixed(1)}" y="${(y+3.8).toFixed(1)}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10.5" font-weight="600" fill="${p.opt?'var(--city)':'var(--on-ink)'}">${p.n}</text>
      <text class="lbl" x="${lx.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}">${esc(name)}</text>
      ${kmTag[p.k]?`<text x="${(x+(x>W/2?-16:16)).toFixed(1)}" y="${(y+(y>H/2?-16:26)).toFixed(1)}" text-anchor="${x>W/2?'end':'start'}" font-family="DM Sans,sans-serif" font-size="9.5" fill="var(--ink-3)">${dist(p.k).toFixed(0)} km</text>`:""}</g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(day.md)} 路線示意圖">
    ${bg}
    <polyline points="${line}" fill="none" stroke="var(--city)" stroke-width="2" stroke-linejoin="round" opacity=".28"/>
    <polyline points="${line}" fill="none" stroke="var(--saffron)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0.5 7"/>
    ${dots}
    <g transform="translate(14 ${H-14})" font-family="DM Sans,sans-serif" font-size="10" fill="var(--ink-3)"><line x1="0" y1="0" x2="${(kmPx*bar).toFixed(1)}" y2="0" stroke="var(--ink-3)" stroke-width="2"/><line x1="0" y1="-3" x2="0" y2="3" stroke="var(--ink-3)"/><line x1="${(kmPx*bar).toFixed(1)}" y1="-3" x2="${(kmPx*bar).toFixed(1)}" y2="3" stroke="var(--ink-3)"/><text x="0" y="-7">${bar>=1?bar+" km":bar*1000+" m"}</text></g>
    <g transform="translate(${W-18} ${H-26})" font-family="DM Sans,sans-serif" font-size="10" fill="var(--ink-3)" text-anchor="middle"><path d="M0 -10l4 9h-8z" fill="var(--ink-3)"/><text y="11">N</text></g>
  </svg>`;
}

function routeLinks(seq){
  if(seq.length<2) return "";
  // Google Maps /dir/ handles ~10 stops per link; split longer days, overlapping the joint stop
  const chunks=[]; for(let i=0;i<seq.length-1;i+=9) chunks.push(seq.slice(i,i+10));
  return chunks.map((c,i)=>{
    const url="https://www.google.com/maps/dir/"+c.map(k=>`${P[k][0]},${P[k][1]}`).join("/");
    const label=chunks.length===2?["前半天路線","後半天路線"][i]:chunks.length>2?`第 ${i+1} 段路線`:"Google 地圖開整天路線";
    return `<a class="route-btn${i?' alt':''}" href="${url}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;
  }).join("");
}

function hoursOf(it,day){ const v=hoursOn(it.place,day.date); return v==null?null:{v,ok:openAt(v,it.t)}; }
function hoursHTML(it,day){

    <details class="week-d"><summary>整週</summary><table class="week">${week}</table></details>`;

function nowState(day){
  if(day.date!==todayStr()) return {cur:null,next:null};
  const m=nowMin(); let cur=null,next=null;
  day.items.forEach((it,i)=>{ if(!it.t) return; const tm=hm(it.t); if(tm<=m) cur=i; else if(next===null) next=i; });
  return {cur,next};
}

function select(id,save){

        ${it.eats?`<p class="eats"><b>評論推薦</b>${it.eats.map(([d,n,st])=>`<span class="dish${st?' st':''}">${esc(d)}${n?`<small>（${esc(n)}）</small>`:""}</span>`).join("、")}</p>`:""}

    ${Object.keys(nums).length?(nBad?`<li class="warn"><b>${nBad}</b>個營業時間對不上</li>`:`<li class="ok">營業時間都對得上</li>`):""}
  </ul>`;
  let nextup="";
  if(next!==null){ const it=day.items[next], mins=hm(it.t)-nowMin();
    nextup=`<div class="nextup"><span class="lbl">下一站</span><span class="t">${it.t}</span><span class="what">${esc(it.title)}</span><span class="eta">${fmtDur(mins)}後</span>${it.place?`<a href="${navUrl(it.place)}" target="_blank" rel="noopener">導航 ↗</a>`:""}</div>`; }
  const legend=Object.keys(nums).map(k=>`<li><button class="num${seq.includes(k)?'':' opt'}" data-place="${esc(k)}" aria-label="在地圖上標出 ${esc(k)}">${nums[k]}</button><a href="${gUrl(k)}" target="_blank" rel="noopener" title="${esc(k)}">${esc(k)}</a></li>`).join("");
  const nPlaces=Object.keys(nums).length;
  $("#view").innerHTML=`<section class="day-view c-${c}" role="tabpanel" aria-labelledby="tab-${day.id}">

          ${nPlaces>1?`<p class="mapnote">${c==="bcn"?"底紋是擴建區 133 公尺的街廓方向。":c==="mad"?"底紋是以太陽門 Km 0 為中心、每 500 公尺一圈。":""}空心圈是有空再去的點，太遠的點（機場）貼在邊上。點數字會在行程裡標出那一站。</p>`:""}
          ${seq.length>1?`<div class="route-btns">${routeLinks(seq)}</div>`:""}
          ${nPlaces?`<details class="places"><summary>全部 ${nPlaces} 個地點</summary><ul class="legend-list">${legend}</ul></details>`:""}
        </div>
        ${nShot?`<div class="panel p-shots"><h4>今天要拍<small>點一下跳到那一站</small></h4><ul class="shot-list">${dayShots.map(d=>`<li><span class="w">${d.t||"隨時"}</span><span><button type="button" data-jump="${d.i}">${esc(d.x)}</button><small>${esc(d.title)}</small></span></li>`).join("")}</ul></div>`:""}
        <div class="panel p-notes"><h4>注意</h4><ul class="notes">${day.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>
      </aside>
    </div></section>`;
  bind(day);
}

function highlight(place,scroll){
  document.querySelectorAll(".num").forEach(b=>b.classList.toggle("on",b.dataset.place===place));
  document.querySelectorAll(".pt").forEach(g=>{const on=g.dataset.place===place; g.classList.toggle("on",on); if(on) g.parentNode.appendChild(g);});
  document.querySelectorAll(".it").forEach(li=>li.classList.toggle("hot",li.dataset.place===place));
  if(scroll){ const li=document.querySelector(`.it[data-place="${CSS.escape(place)}"]`);
    if(li) li.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"}); }
}
function bind(){
  const fine=matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".num").forEach(b=>b.onclick=()=>highlight(b.dataset.place,true));
  document.querySelectorAll(".pt").forEach(g=>{g.onclick=()=>highlight(g.dataset.place,true);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();highlight(g.dataset.place,true)}}});
  if(fine) document.querySelectorAll(".it[data-place]").forEach(li=>{ if(li.dataset.place) li.onmouseenter=()=>highlight(li.dataset.place,false); });
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ const li=document.querySelector(`.it[data-i="${b.dataset.jump}"]`); if(!li) return; li.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"}); li.classList.add("hot"); setTimeout(()=>li.classList.remove("hot"),1600); });
  document.querySelectorAll(".it .node").forEach(c=>c.onchange=()=>{
    if(c.checked) done[c.dataset.key]=1; else delete done[c.dataset.key];
    store.set("trip-done",JSON.stringify(done));
    c.closest(".it").classList.toggle("done",c.checked);
  });
}

function updatePackCounts(){

  document.querySelectorAll(".pk-sec").forEach((sec,si)=>{const n=PACK[si].items.length, g=PACK[si].items.filter((_,ii)=>packed[`${si}-${ii}`]).length; const el=sec.querySelector(".pk-n"); el.textContent=`${g}/${n}`; el.classList.toggle("full",g===n);});

}

(function init(){
  const h=(location.hash||"").slice(1), t=todayStr();
  const byToday=DAYS.find(d=>d.date===t);
  const saved=store.get("trip-day");
  const valid=x=>x==="pack"||DAYS.some(d=>d.id===x);
  const start = valid(h)?h : byToday?byToday.id : valid(saved)?saved : "d0";
  select(start,false);
  // keep the strip height in sync for sticky offsets, and show a hairline once it sticks
  const shell=$("#strip-shell");
  const sync=()=>document.documentElement.style.setProperty("--strip-h",shell.offsetHeight+"px");
  sync(); addEventListener("resize",sync);
  if("IntersectionObserver" in window){ const s=document.createElement("div"); shell.before(s); new IntersectionObserver(([e])=>shell.classList.toggle("stuck",!e.isIntersecting)).observe(s); }
  setInterval(()=>{ const sel=document.querySelector('.day[aria-selected="true"]'); if(sel&&sel.dataset.id!=="pack"&&DAYS.find(x=>x.id===sel.dataset.id).date===todayStr()){ const y=scrollY; select(sel.dataset.id,false); scrollTo(0,y);} },60000);
})();
